[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arxiv-digest"
version = "0.1.0"
description = "arXiv paper digest pipeline: fetch new papers by category, LLM-summarize in Chinese with relevance rating, render a Markdown daily digest. Runs fully offline without an API key (no-summary mode)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Xuening Pi" }]
keywords = ["arxiv", "llm", "pipeline", "digest"]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
llm = ["openai>=1.40"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
arxiv-digest = "arxiv_digest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv_digest"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
